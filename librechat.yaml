# Stanford AI Playground Configuration
# For more information, see the Configuration Guide:
# https://www.librechat.ai/docs/configuration/librechat_yaml

# Configuration version (required)
version: 1.2.1

# Cache settings: Set to true to enable caching
cache: true

# Custom interface configuration
interface:
  # Stanford theme is activated by including "Stanford" in the customWelcome message
  customWelcome: 'Welcome to the Stanford AI Playground'
  
  # Enable/disable file search as a chatarea selection (default: true)
  fileSearch: true
  
  # Privacy policy settings
  privacyPolicy:
    externalUrl: 'https://www.stanford.edu/site/privacy/'
    openNewTab: true

  # Terms of service
  termsOfService:
    externalUrl: 'https://www.stanford.edu/site/terms/'
    openNewTab: true
    modalAcceptance: true
    modalTitle: 'Terms of Service for Stanford AI Playground'
    modalContent: |
      # Terms and Conditions for Stanford AI Playground

      *Effective Date: January 2025*

      Welcome to the Stanford AI Playground. By using this service, you agree to these terms.

      ## 1. Acceptable Use
      
      The Stanford AI Playground is provided for educational and research purposes for the Stanford community. 
      Users must comply with Stanford's Acceptable Use Policy.

      ## 2. Data Privacy
      
      - Data you provide is for your use only during your interaction with the service
      - Text and files you upload will not be saved by the vendor or used to train the LLM
      - This service is NOT approved for high-risk data including PHI or PII

      ## 3. Limitations
      
      While LLMs are advanced tools, they are not flawless and may create errors or hallucinations.
      Take caution before using results verbatim.

      ## 4. Contact
      
      For questions or support, contact the Stanford IT team.

  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true

# Speech-to-Text (STT) configuration for audio transcription
speech:
  stt:
    openai:
      apiKey: ${OPENAI_API_KEY}
      model: whisper-1
      url: https://api.openai.com/v1/audio/transcriptions


